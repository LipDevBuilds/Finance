<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ledger</title>
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--ink:#1b2430;--muted:#66707d;--line:#e3e6ea;
  --accent:#2563eb;--good:#188a52;--bad:#c23b3b;--chip:#eef1f5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101418;--card:#1a2027;--ink:#e8ecf1;--muted:#939ca7;--line:#2a323c;
  --accent:#5b8def;--good:#3fbf82;--bad:#e26d6d;--chip:#232b34;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
header{padding:14px 16px 6px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:18px;margin:0}
header .mo{color:var(--muted);font-size:13px}
.wrap{max-width:640px;margin:0 auto}
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tile .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:17px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.v.neg{color:var(--bad)}.v.pos{color:var(--good)}
.tabs{display:flex;gap:6px;padding:6px 16px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;padding:8px 0;font:inherit;font-size:13px}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.list{padding:6px 16px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.entry .d{min-width:0}
.entry .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .s{font-size:12.5px;color:var(--muted)}
.entry .amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.entry .amt.exp{color:var(--bad)}.entry .amt.inc{color:var(--good)}
.entry button{border:0;background:none;color:var(--muted);font-size:16px;padding:4px}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 6px;-webkit-overflow-scrolling:touch}
.chipbar span{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .row{max-width:640px;margin:0 auto;display:flex;gap:8px}
.bar input{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;min-width:0}
.bar button{border:0;border-radius:12px;padding:0 16px;font:inherit;font-weight:600}
#send{background:var(--accent);color:#fff}
#mic{background:var(--chip);color:var(--ink);font-size:18px}
#mic.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
#hint{max-width:640px;margin:6px auto 0;font-size:12px;color:var(--muted);text-align:center;min-height:15px}
.calcbox{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 16px;padding:12px}
.calcbox h3{margin:0 0 6px;font-size:14px}
.calcbox p{margin:4px 0;font-size:13.5px;color:var(--muted)}
.calcbox b{color:var(--ink)}
a.exp{display:block;text-align:center;color:var(--accent);font-size:13px;margin:10px 0 4px;cursor:pointer}
#acct{color:var(--accent);cursor:pointer;font-size:13px}
.ovl{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;align-items:center;justify-content:center;padding:24px}
.ovl.hide{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:360px}
.panel h2{margin:0 0 4px;font-size:18px}
.panel p{color:var(--muted);font-size:13px;margin:0 0 12px}
.panel .acctbtn{display:block;width:100%;text-align:left;background:var(--chip);color:var(--ink);border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:600;margin-bottom:8px}
.panel input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 14px;font:inherit;margin-bottom:8px}
.panel .go{width:100%;border:0;border-radius:10px;padding:12px 0;background:var(--accent);color:#fff;font:inherit;font-weight:600}
.panel .err{color:var(--bad);font-size:13px;min-height:16px;margin:4px 0 0}
#syncdot{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Ledger</h1><div><span id="syncdot"></span> <span id="acct"></span> <span class="mo" id="month"></span></div></header>
  <div class="tiles">
    <div class="tile"><div class="l">Spent</div><div class="v neg" id="tSpent">–</div></div>
    <div class="tile"><div class="l">Income</div><div class="v pos" id="tInc">–</div></div>
    <div class="tile"><div class="l">Debt</div><div class="v" id="tDebt">–</div></div>
  </div>
  <div class="chipbar" id="chips"></div>
  <div class="tabs">
    <button data-tab="entries" class="on">Entries</button>
    <button data-tab="debts">Debts</button>
    <button data-tab="calc">Calc</button>
  </div>
  <div class="list" id="list"></div>
  <a class="exp" id="export">Export data (JSON)</a>
  <a class="exp" id="syncset">Sync settings</a>
</div>
<div class="ovl" id="login">
  <div class="panel">
    <h2>Who's this?</h2>
    <p>Each account keeps its own history on this device (and syncs online if a backend is configured).</p>
    <div id="acctList"></div>
    <input id="newName" placeholder="Account name" autocomplete="off">
    <input id="newPin" placeholder="PIN (optional, 4+ digits)" inputmode="numeric" type="password" autocomplete="off">
    <button class="go" id="create">Create account</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div class="bar">
  <div class="row">
    <input id="inp" placeholder='e.g. "spent 12.50 on lunch"' autocomplete="off" enterkeyhint="send">
    <button id="mic" title="Voice entry">🎤</button>
    <button id="send">Add</button>
  </div>
  <div id="hint">Try: spent 40 on gas · got 1200 salary · owe John 500 · paid John 100 · budget 300 food</div>
</div>
<script>
"use strict";
/* Storage: schema kept flat + versioned so future app/bank-sync integrations
   can map entries onto real transactions (see README). */
/* Accounts: each account has its own store under ledger.acct.<name>.
   Optional PIN is a SHA-256 hash — a courtesy lock on a shared phone,
   not cryptographic security (data is client-side). */
let user=null,db=null;
const KEY=()=>"ledger.acct."+user;
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){hint("Storage unavailable — data not saved");}};
const accounts=()=>lsGet("ledger.accounts")||[];
async function pinHash(pin){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ledger:"+pin));
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
function load(){
  const d=lsGet(KEY());if(d&&d.entries)return d;
  const legacy=lsGet("ledger.v1"); // adopt pre-accounts data into the first account
  if(legacy&&legacy.entries){localStorage.removeItem("ledger.v1");legacy.updatedAt=Date.now();lsSet(KEY(),legacy);return legacy;}
  return{version:1,entries:[],debts:[],budgets:{},updatedAt:0};
}
function save(){db.updatedAt=Date.now();lsSet(KEY(),db);pushSync();}

/* Optional backend sync (see backend/): store {url, key} in ledger.sync.
   Whole-account blob, newest updatedAt wins. */
const sync=()=>lsGet("ledger.sync");
function dot(s){document.getElementById("syncdot").textContent=s;}
let pushT=null;
function pushSync(){const c=sync();if(!c||!user)return;clearTimeout(pushT);
  pushT=setTimeout(async()=>{try{
    dot("⟳");
    const r=await fetch(c.url+"/account/"+encodeURIComponent(user),{method:"PUT",
      headers:{"content-type":"application/json","x-ledger-key":c.key||""},body:JSON.stringify(db)});
    dot(r.ok?"●":"○");
  }catch(e){dot("○");}},800);}
async function pullSync(){const c=sync();if(!c||!user)return;try{
    dot("⟳");
    const r=await fetch(c.url+"/account/"+encodeURIComponent(user),{headers:{"x-ledger-key":c.key||""}});
    if(r.ok){const remote=await r.json();
      if(remote&&remote.entries&&(remote.updatedAt||0)>(db.updatedAt||0)){db=remote;lsSet(KEY(),db);render();}}
    dot("●");
  }catch(e){dot("○");}}

/* login flow */
function renderLogin(){
  document.getElementById("acctList").innerHTML=accounts().map(a=>
    `<button class="acctbtn" data-acct="${esc(a.name)}">${esc(a.name)}${a.pinHash?" 🔒":""}</button>`).join("");
}
async function enter(name){
  user=name;db=load();
  document.getElementById("login").classList.add("hide");
  document.getElementById("acct").textContent=name+" ·";
  render();pullSync();
}
document.getElementById("acctList").addEventListener("click",async e=>{
  const n=e.target.dataset.acct;if(!n)return;
  const a=accounts().find(x=>x.name===n);
  if(a.pinHash){
    const pin=prompt("PIN for "+n);
    if(pin==null)return;
    if(await pinHash(pin)!==a.pinHash){loginErr.textContent="Wrong PIN";return;}
  }
  enter(n);
});
document.getElementById("create").onclick=async()=>{
  const name=document.getElementById("newName").value.trim();
  const pin=document.getElementById("newPin").value.trim();
  if(!name){loginErr.textContent="Enter a name";return;}
  if(accounts().some(a=>a.name.toLowerCase()===name.toLowerCase())){loginErr.textContent="Name taken";return;}
  const acct={name,pinHash:pin?await pinHash(pin):null};
  lsSet("ledger.accounts",[...accounts(),acct]);
  enter(name);
};
document.getElementById("syncset").onclick=()=>{
  const c=sync()||{};
  const url=prompt("Backend URL (from backend/ deploy — blank to disable)",c.url||"");
  if(url==null)return;
  if(!url.trim()){localStorage.removeItem("ledger.sync");dot("");hint("Sync off");return;}
  const key=prompt("Shared key (LEDGER_KEY)",c.key||"");if(key==null)return;
  lsSet("ledger.sync",{url:url.trim().replace(/\/$/,""),key:key.trim()});
  hint("Sync on");pullSync();pushSync();
};
document.getElementById("acct").onclick=()=>{ // switch account
  user=null;db=null;renderLogin();
  document.getElementById("login").classList.remove("hide");
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>(n<0?"-":"")+"$"+Math.abs(n).toFixed(2);

/* ---------- natural-language parser (chat + voice share this) ---------- */
function parse(raw){
  const s=raw.trim().toLowerCase().replace(/[$,]/g,"");
  const num=s.match(/-?\d+(?:\.\d+)?/);
  const amt=num?parseFloat(num[0]):null;
  const who=cap((s.match(/(?:owe|to|from|paid|pay)\s+([a-z]+)/)||[])[1]||"");
  if(/^budget/.test(s)&&amt!=null){
    const cat=(s.match(/budget\s+[\d.]+\s+(?:for\s+|on\s+)?(\w+)/)||[])[1]||"general";
    return{kind:"budget",cat,amt};
  }
  if(/\bowe\b|\bborrow(ed)?\b|\bdebt\b/.test(s)&&amt!=null)
    return{kind:"debt",who:who||"someone",amt};
  if(/\bpaid\b|\bpay\b|\brepaid\b/.test(s)&&who&&db.debts.some(d=>d.who===who)&&amt!=null)
    return{kind:"payment",who,amt};
  if(/\b(got|earned|income|salary|received|made)\b/.test(s)&&amt!=null){
    return{kind:"income",amt,note:noteFrom(s)};
  }
  if(amt!=null){ // default: expense
    return{kind:"expense",amt,cat:catFrom(s),note:noteFrom(s)};
  }
  return null;
}
function noteFrom(s){
  const m=s.match(/(?:on|for|from)\s+(.+)$/);
  return cap((m?m[1]:s).replace(/-?\d+(\.\d+)?/g,"").trim())||"Entry";
}
const CATS={food:/lunch|dinner|breakfast|food|grocer|coffee|restaurant|snack/,
  transport:/gas|fuel|uber|bus|train|taxi|parking|car/,
  home:/rent|electric|water|internet|utilit|mortgage/,
  fun:/game|movie|music|fun|bar|party|robux/,
  health:/doctor|pharmacy|gym|med/};
function catFrom(s){for(const c in CATS)if(CATS[c].test(s))return c;return"other";}
const cap=w=>w?w[0].toUpperCase()+w.slice(1):"";

/* ---------- actions ---------- */
function apply(p){
  const now=new Date().toISOString();
  if(p.kind==="expense"||p.kind==="income"){
    db.entries.unshift({id:uid(),type:p.kind,amount:p.amt,category:p.cat||"income",note:p.note,date:now,source:"manual"});
    hint((p.kind==="expense"?"Spent ":"Income ")+fmt(p.amt)+" — "+p.note);
  }else if(p.kind==="debt"){
    let d=db.debts.find(d=>d.who===p.who);
    if(d)d.amount+=p.amt;else db.debts.push({id:uid(),who:p.who,amount:p.amt,date:now});
    hint("Debt: you owe "+p.who+" "+fmt(p.amt)+" more");
  }else if(p.kind==="payment"){
    const d=db.debts.find(d=>d.who===p.who);
    d.amount-=p.amt;if(d.amount<=0.005)db.debts=db.debts.filter(x=>x!==d);
    db.entries.unshift({id:uid(),type:"expense",amount:p.amt,category:"debt",note:"Paid "+p.who,date:now,source:"manual"});
    hint("Paid "+p.who+" "+fmt(p.amt));
  }else if(p.kind==="budget"){
    db.budgets[p.cat]=p.amt;hint("Budget for "+p.cat+": "+fmt(p.amt)+"/mo");
  }
  save();render();
}
function submit(text){
  if(!text.trim())return;
  const p=parse(text);
  if(!p){hint('Couldn\'t parse — include an amount, e.g. "spent 20 on gas"');return;}
  apply(p);inp.value="";
}

/* ---------- render ---------- */
let tab="entries";
function monthEntries(){const m=new Date().toISOString().slice(0,7);return db.entries.filter(e=>e.date.slice(0,7)===m);}
function render(){
  if(!db)return;
  const me=monthEntries();
  const spent=me.filter(e=>e.type==="expense").reduce((a,e)=>a+e.amount,0);
  const inc=me.filter(e=>e.type==="income").reduce((a,e)=>a+e.amount,0);
  const debt=db.debts.reduce((a,d)=>a+d.amount,0);
  tSpent.textContent=fmt(spent);tInc.textContent=fmt(inc);
  tDebt.textContent=fmt(debt);tDebt.className="v"+(debt>0?" neg":"");
  month.textContent=new Date().toLocaleDateString(undefined,{month:"long",year:"numeric"});
  // budget chips
  const byCat={};me.filter(e=>e.type==="expense").forEach(e=>byCat[e.category]=(byCat[e.category]||0)+e.amount);
  chips.innerHTML=Object.entries(db.budgets).map(([c,b])=>{
    const u=byCat[c]||0,over=u>b;
    return`<span style="${over?"color:var(--bad)":""}">${c}: ${fmt(u)} / ${fmt(b)}</span>`;
  }).join("")||"";
  // list
  if(tab==="entries"){
    list.innerHTML=db.entries.length?db.entries.map(e=>`
      <div class="entry"><div class="d">
        <div class="t">${esc(e.note)}</div>
        <div class="s">${e.category} · ${new Date(e.date).toLocaleDateString(undefined,{month:"short",day:"numeric"})}${e.source!=="manual"?" · "+e.source:""}</div>
      </div><div class="amt ${e.type==="expense"?"exp":"inc"}">${e.type==="expense"?"−":"+"}${fmt(e.amount)}</div>
      <button data-del="${e.id}">✕</button></div>`).join("")
      :'<div class="empty">No entries yet. Type or speak one below.</div>';
  }else if(tab==="debts"){
    list.innerHTML=db.debts.length?db.debts.map(d=>`
      <div class="entry"><div class="d"><div class="t">${esc(d.who)}</div>
      <div class="s">say "paid ${esc(d.who)} 50" to reduce</div></div>
      <div class="amt exp">${fmt(d.amount)}</div>
      <button data-deld="${d.id}">✕</button></div>`).join("")
      :'<div class="empty">No debts. Say "owe John 500".</div>';
  }else{
    const days=new Date().getDate();
    const daysInMo=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
    const rate=spent/days, proj=rate*daysInMo, net=inc-spent;
    const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
    list.innerHTML=`<div class="calcbox"><h3>This month</h3>
      <p>Net (income − spent): <b>${fmt(net)}</b></p>
      <p>Daily burn rate: <b>${fmt(rate||0)}</b>/day</p>
      <p>Projected month-end spend: <b>${fmt(proj||0)}</b></p>
      ${top?`<p>Biggest category: <b>${top[0]}</b> at ${fmt(top[1])}</p>`:""}
      <p>Total outstanding debt: <b>${fmt(debt)}</b>${debt>0&&net>0?` — cleared in ~<b>${Math.ceil(debt/net)}</b> months at this net rate`:""}</p>
    </div>`;
  }
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hint(m){document.getElementById("hint").textContent=m;}

/* ---------- wiring ---------- */
const inp=document.getElementById("inp");
document.getElementById("send").onclick=()=>submit(inp.value);
inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit(inp.value);});
document.querySelector(".tabs").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render();
});
list.addEventListener("click",e=>{
  const del=e.target.dataset.del,deld=e.target.dataset.deld;
  if(del){db.entries=db.entries.filter(x=>x.id!==del);save();render();}
  if(deld){db.debts=db.debts.filter(x=>x.id!==deld);save();render();}
});
document.getElementById("export").onclick=()=>{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="ledger-export.json";a.click();
};

/* voice: Web Speech API (free, on-device/browser). Falls back gracefully. */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=document.getElementById("mic");
if(SR){
  const rec=new SR();rec.lang=navigator.language||"en-US";rec.interimResults=false;
  let on=false;
  mic.onclick=()=>{if(on){rec.stop();return;}try{rec.start();}catch(e){}};
  rec.onstart=()=>{on=true;mic.classList.add("rec");hint("Listening…");};
  rec.onend=()=>{on=false;mic.classList.remove("rec");};
  rec.onerror=e=>hint(e.error==="not-allowed"?"Mic permission denied":"Voice error: "+e.error);
  rec.onresult=e=>{const t=e.results[0][0].transcript;inp.value=t;submit(t);};
}else{mic.onclick=()=>hint("Voice not supported in this browser — use Chrome/Safari");}

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
/* start: auto-enter a lone PIN-less account, else show the picker */
(()=>{const as=accounts();
  if(as.length===1&&!as[0].pinHash)enter(as[0].name);
  else renderLogin();})();
</script>
</body>
</html>
